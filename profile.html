<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootyNet - Cá Nhân</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor-dot" id="cursorDot"></div><div class="cursor-outline" id="cursorOutline"></div>
    <header class="top-nav glass-effect">
        <div class="logo" style="cursor: pointer;" onclick="window.location.href='index.html';">
            <i data-lucide="aperture" class="logo-icon"></i><span>FootyNet</span>
        </div>
        <div class="search-bar"><i data-lucide="search"></i><input type="text" id="searchInput" placeholder="Tìm kiếm khoảnh khắc..."></div>
        <div class="nav-actions">
            <button class="btn-icon" id="themeToggleBtn" title="Giao diện Tối/Sáng"><i data-lucide="moon"></i></button>
            <div id="auth-section" class="user-profile" style="display:flex; align-items:center; gap:15px;">
                <!-- NÚT PHÒNG CHAT -->
                <div class="notification-wrapper" id="chatBtn" title="Tin nhắn riêng">
                    <i data-lucide="message-square"></i>
                    <span class="noti-badge" id="chatBadge" style="display:none;">0</span>
                </div>
                <div class="notification-wrapper" id="notiBellBtn" title="Thông báo"><i data-lucide="bell"></i><span class="noti-badge" id="notiBadge" style="display:none;">0</span></div>
                <span id="displayUserName" class="user-name-tag">Đang tải...</span>
                <button class="btn-icon" id="logoutBtn" title="Đăng xuất"><i data-lucide="log-out"></i></button>
            </div>
        </div>
    </header>

    <main class="profile-container">
        <div class="profile-header-modern">
            <div class="avatar-wrap"><img src="" id="profileAvatar"></div>
            <div class="profile-info">
                <h1 id="profileName">User</h1><p id="profileEmail" class="text-muted">email</p><p id="profileBio" class="bio-text">Đang tải...</p>
                <button class="btn btn-outline small-btn" id="showEditProfileBtn"><i data-lucide="pencil" style="width: 14px;"></i> Chỉnh sửa</button>
            </div>
        </div>
        <div class="profile-tabs">
            <button class="tab-btn active" data-tab="my-posts">Đã tạo</button>
            <button class="tab-btn" data-tab="liked-posts">Đã thích</button>
            <button class="tab-btn" data-tab="my-boards">Bộ sưu tập</button>
            <button class="tab-btn" data-tab="security-logs"><i data-lucide="shield" style="width: 16px; margin-right: 4px; display: inline-block; vertical-align: text-bottom;"></i>Bảo mật</button>
        </div>
        <div id="boardHeader" class="board-header"><button class="btn-icon" id="backToBoardsBtn"><i data-lucide="arrow-left"></i></button><h2 id="currentBoardName">Tên bảng</h2></div>
        <div class="masonry-grid" id="profileGrid"></div>
    </main>

    <div id="toastContainer" class="toast-container"></div>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-content" style="max-width: 350px; text-align: center; padding: 30px;">
            <h3 id="confirmMessage" style="margin-bottom: 24px; font-size: 1.1rem;">Bạn có chắc chắn không?</h3>
            <div style="display: flex; gap: 12px; justify-content: center;"><button class="btn btn-glass" id="cancelConfirmBtn" style="flex: 1;">Hủy</button><button class="btn btn-primary" id="acceptConfirmBtn" style="flex: 1; background: #e60023;">Đồng ý</button></div>
        </div>
    </div>

    <!-- MODAL PHÒNG CHAT -->
    <div class="modal-overlay" id="chatModal">
        <div class="modal-content" style="max-width: 900px; padding: 0; overflow: hidden; border-radius: 24px;">
            <div style="padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--modal-bg);">
                <h2 style="margin: 0; font-size: 1.3rem;"><i data-lucide="message-square" style="display:inline-block; vertical-align:middle; margin-right:8px;"></i>Phòng Chat Kín</h2>
                <span class="close-modal" id="closeChat" style="position: static;"><i data-lucide="x"></i></span>
            </div>
            <div class="chat-layout">
                <div class="chat-sidebar" id="friendList"></div>
                <div class="chat-main" id="chatWindow" style="display:none;">
                    <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 1.1rem; background: var(--modal-bg);" id="chatActiveUser"></div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Nhắn tin mã hóa..." class="input-field">
                        <button class="btn btn-primary" id="chatSendBtn"><i data-lucide="send" style="width:18px;"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="notiModal"><div class="modal-content" style="padding: 0; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; max-width: 500px;"><div style="padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;"><h2 style="margin: 0; font-size: 1.3rem;">Thông báo</h2><span class="close-modal" id="closeNoti" style="position: static;"><i data-lucide="x"></i></span></div><div id="notiList" style="flex: 1; overflow-y: auto;"></div></div></div>
    <div class="modal-overlay" id="editProfileModal"><div class="modal-content"><span class="close-modal" id="closeEditProfile"><i data-lucide="x"></i></span><h2>Hồ sơ</h2><input type="file" id="avatarInput" accept="image/*" class="file-input"><textarea id="bioInput" placeholder="Tiểu sử..." class="input-field caption-area" style="height:80px;"></textarea><button class="btn btn-primary" id="saveProfileBtn">Lưu</button></div></div>
    <div class="modal-overlay" id="boardModal"><div class="modal-content"><span class="close-modal" id="closeBoard"><i data-lucide="x"></i></span><h2>Lưu vào bảng</h2><div id="boardList" class="board-list" style="margin-bottom:15px; max-height:200px; overflow-y:auto;"></div><input type="text" id="newBoardInput" placeholder="Tên bảng mới" class="input-field"><button class="btn btn-primary" id="createBoardBtn" style="margin-top:10px;">Tạo bảng mới</button></div></div>
    
    <div class="modal-overlay" id="postDetailModal">
        <div class="modal-content post-detail-content">
            <span class="close-modal" id="closePostDetail"><i data-lucide="x"></i></span>
            <div class="post-detail-layout">
                <div class="post-detail-image" id="detailImageContainer" title="Nhấp đúp để thả tim!"><img id="detailImage" src=""><div id="doubleTapHeart" class="double-tap-heart"><i data-lucide="heart"></i></div></div>
                <div class="post-detail-info">
                    <div class="detail-header">
                        <span class="author-tag">
                            <i data-lucide="user"></i> <span id="authorNameText"></span>
                            <!-- NÚT KẾT BẠN MỚI -->
                            <button id="addFriendBtn" class="btn btn-outline small-btn" style="display:none; margin-left: 10px; font-size: 0.75rem; padding: 4px 10px;"><i data-lucide="user-plus" style="width:14px;"></i> Kết bạn</button>
                        </span>
                        <div style="display:flex; gap:10px;"><button id="detailDownloadBtn" class="btn-icon" title="Tải ảnh đóng bản quyền"><i data-lucide="download"></i></button><button id="detailDeletePostBtn" class="btn-icon text-danger" style="display:none;" title="Xóa hẳn bài viết"><i data-lucide="trash-2"></i></button><button id="detailRemovePinBtn" class="btn-icon text-danger" style="display:none;" title="Gỡ khỏi bộ sưu tập"><i data-lucide="folder-minus"></i></button><button class="btn btn-primary" id="detailSaveBtn">Lưu</button></div>
                    </div>
                    <p id="detailCaption" class="detail-caption"></p>
                    <div class="detail-stats"><button class="action-btn" id="detailHeartBtn"><i data-lucide="heart"></i></button><span id="detailLikes">0</span></div>
                    <div class="comments-section">
                        <div id="detailCommentList" class="detail-comments"></div>
                        <div class="detail-comment-input"><input type="text" id="detailCommentInput" placeholder="Thêm bình luận..." class="input-field"><button class="btn-icon send-btn" id="detailSubmitCommentBtn"><i data-lucide="send"></i></button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="profile.js"></script>
</body>
</html>
